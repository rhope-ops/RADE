<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RADE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="assets/logo/logo-rho-32.png">
<style>
/* Layout: the RADE window as a page ("One thing", docs/window-design.md): the band
   (the header of the 90-161.Z page: navy to blue, a yellow line under it; the logo, RADE with the tagline under it, and
   the Teams channel at the right, centered on the word RADE; the Administrator, 18 Nov 26), one card whose left edge is at 12 % of the width, a bottom line and a 4 px bar on the bottom edge.
   Colors, one meaning each: navy = text and focus; blue = the action and progress; yellow = your turn;
   dark red = failed; green = done; gray = second lines. The light-theme values are the window's ($ui.C in
   engine/rade_build.py). Sizes: docs/window-design.md "Sizes" (a button is 132 x 40 at least; a link is underlined). */
:root{--bg:#ffffff;--navy:#0b2545;--text:#1b2430;--gray:#5a6573;--action:#00539f;--action-fg:#ffffff;--link:#00539f;
--turn:#ffd520;--fail:#8b1a1a;--pass:#2e8540;--edge:#7a8794;--track:#e3e8ee;--btn:#ffffff;
--ui:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;--mono:Consolas,"Cascadia Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e141c;--navy:#dde8f3;--text:#e6ebf1;--gray:#a5b1c0;--action:#00539f;--action-fg:#ffffff;--link:#8db4ec;
--turn:#ffd520;--fail:#f0a3a3;--pass:#6cc487;--edge:#8794a6;--track:#243143;--btn:#172130;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e141c;--navy:#dde8f3;--text:#e6ebf1;--gray:#a5b1c0;--action:#00539f;--action-fg:#ffffff;--link:#8db4ec;
--turn:#ffd520;--fail:#f0a3a3;--pass:#6cc487;--edge:#8794a6;--track:#243143;--btn:#172130;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:1rem/1.5 var(--ui)}
.win{min-height:100%;display:flex;flex-direction:column}
.row{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* The band has fixed colors (white text on navy to blue) in both themes. Grid: the logo spans two rows; row 1 = RADE and the channel, so their midpoints match. */
.band{flex:none;background:linear-gradient(100deg,#0b2545,#00539f);color:#fff;border-bottom:3px solid var(--turn)}
.band-in{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:1fr auto auto 1fr;column-gap:14px;align-items:center;padding-block:18px}
.band img{grid-row:1/-1;width:64px;height:64px}
.band .name{grid-area:2/2;margin:0;font-size:1.375rem;line-height:1.2;font-weight:650;color:#fff}
.band .sub{grid-area:3/2/auto/-1;margin:2px 0 0;color:#dde8f3;font-size:.875rem}
.band .team{grid-area:2/3;margin:0;color:#fff;font-size:.8125rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;text-align:right}
.stage{flex:1;display:flex;flex-direction:column}
.stage::before{content:"";flex:2 1 0}
.stage::after{content:"";flex:3 1 0}
.card{margin-left:12%;max-width:42rem;min-width:0;padding-block:16px;display:flex;flex-direction:column;gap:14px}
@media (max-width:720px){.card{margin-left:0}}
.caps{margin:0;font-size:.8125rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--gray)}
.win[data-light="fail"] .caps{color:var(--fail)}
h1{margin:0;font-size:1.8rem;line-height:1.2;font-weight:600;color:var(--navy);text-wrap:balance}
.card p{margin:0;max-width:65ch;overflow-wrap:anywhere}
.second{color:var(--gray);font-size:.875rem;font-variant-numeric:tabular-nums}
.file{font-family:var(--mono);font-size:.8125rem}
.todo b{color:var(--navy)}
ol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px;max-width:65ch}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-size:.9375rem;min-width:132px;min-height:40px;padding:6px 16px;border:1px solid var(--edge);border-radius:3px;background:var(--btn);color:var(--text);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btn:hover{border-color:var(--link)}
.btn.primary{background:var(--action);border-color:var(--action);color:var(--action-fg);font-weight:700}
.btn.primary:hover{filter:brightness(1.15)}
.btn.app{display:block;text-align:left;width:100%;padding:10px 16px}
.btn.app b{display:block;color:var(--navy)}
a{color:var(--link);font-weight:700;text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.help{font-size:1.0625rem}
.bottom{display:flex;flex-wrap:wrap;gap:6px 20px;align-items:center;padding-block:10px;font-size:.875rem}
.bottom a{display:inline-flex;align-items:center;min-height:24px}
.bottom .state{margin-left:auto;color:var(--gray);font-variant-numeric:tabular-nums}
.bar{height:4px;flex:none;background:var(--track)}
.bar i{display:block;height:100%;width:0;background:var(--action);transition:width .25s linear}
.win[data-done] .bar i{background:var(--pass)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style></head><body>
<div class="win" id="win">
<header class="band"><div class="row band-in"><img src="assets/logo/logo-rho-64.png" srcset="assets/logo/logo-rho-64.png 1x, assets/logo/logo-rho-128.png 2x" alt=""><p class="name">RADE</p><p class="sub">Test, deploy, enjoy</p><p class="team" id="team"></p></div></header>
<main class="row stage"><div class="card" id="card" aria-live="polite"><p class="caps">RADE</p><h1>Getting the newest script.</h1></div></main>
<footer class="row bottom"><a href="https://github.com/rhope-ops/RADE">Repository</a><a id="back" href="#" hidden>Back</a><span class="state" id="state"></span></footer>
<div class="bar" aria-hidden="true"><i id="bar"></i></div>
</div>
<script>
(function(){
'use strict';
var KEY='rade-page-app-v1';
var win=document.getElementById('win'),card=document.getElementById('card'),state=document.getElementById('state'),bar=document.getElementById('bar'),back=document.getElementById('back');
var HELP='',APPS=[],cur=null,load=0;   // load: a counter for each load, so a late answer of an older load is dropped
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function num(n){return Number(n).toLocaleString('en-US')}
function recall(){try{return localStorage.getItem(KEY)}catch(e){return null}}
function remember(v){try{localStorage.setItem(KEY,v)}catch(e){}}
function web(u){return /^https:\/\//i.test(String(u||''))?String(u):''}   // links from a manifest: https only
function get(url,asJson){return fetch(url,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('code ['+r.status+']');return asJson?r.json():r.text()})}
// light: '' , 'turn' (the page waits for you) or 'fail' (the small caps line turns dark red). The page has no light bar on its top edge (the Administrator, 18 Nov 26). done = the bar turns green.
function show(o){
  win.setAttribute('data-light',o.light||'');
  if(o.done){win.setAttribute('data-done','')}else{win.removeAttribute('data-done')}
  bar.style.width=(o.bar==null?0:o.bar)+'%';
  state.textContent=o.state||'';
  back.hidden=!(APPS.length>1&&cur);
  card.innerHTML=o.html;
  var f=card.querySelector('[data-focus]');if(f){f.focus()}
}
function helpLine(){return HELP?'<p class="help">For help, ask in the Teams channel <b>'+esc(HELP)+'</b>.</p>':''}
function failCard(what,found,todo,btns){
  show({light:'fail',bar:0,state:'FAILED',html:'<p class="caps">Failed</p><h1>'+esc(what)+'</h1>'+
    '<p>Found: '+esc(found)+'</p><p class="todo"><b>What to do:</b> '+todo+'</p><div class="btns">'+btns+'</div>'+helpLine()});
}
function start(){
  cur=null;load++;
  show({bar:10,state:'Loading',html:'<p class="caps">RADE</p><h1>Getting the list of applications.</h1>'});
  get('apps.json',true).then(function(c){
    HELP=c.help||'';
    document.getElementById('team').textContent=HELP?'Teams: '+HELP:'';   // the band shows the channel name (one place: apps.json)
    APPS=(c.apps||[]).map(function(a){return {repo:a.repo,base:a.base||('https://raw.githubusercontent.com/'+a.repo+'/main/'),manifest:a.manifest}});
    if(!APPS.length){show({state:'No applications',html:'<p class="caps">RADE</p><h1>No application is available yet.</h1>'+helpLine()});return}
    var last=recall(),pick=APPS.length===1?APPS[0]:APPS.filter(function(a){return a.repo===last})[0];
    if(pick){open(pick)}else{choose()}
  }).catch(function(e){
    failCard('The list of applications did not load.',e.message||'no answer','Check the network connection, then select "Try again".','<button type="button" class="btn primary" data-act="start" data-focus>Try again</button>');
  });
}
function choose(){
  cur=null;load++;
  show({light:'turn',state:num(APPS.length)+' applications',html:'<p class="caps">Choose</p><h1>Which application?</h1><div class="btns">'+
    APPS.map(function(a,i){return '<button type="button" class="btn app" data-app="'+i+'"'+(i?'':' data-focus')+'><b>'+esc(a.name||a.repo)+'</b></button>'}).join('')+'</div>'+helpLine()});
}
function open(a){
  cur=a;a.url='';a.none=false;remember(a.repo);var my=++load;
  show({bar:30,state:'Loading',html:'<p class="caps">RADE</p><h1>Getting the newest script.</h1><p class="second">'+esc(a.repo)+'</p>'});
  get(a.base+a.manifest,true).then(function(m){
    if(my!==load){return null}
    var b=(m.bundles||[])[(m.bundles||[]).length-1];
    if(!b||!b.out){a.none=true;throw new Error('the application lists no script')}
    var cat=(b.apps||[])[0]||{};
    a.name=(m.application&&m.application.name)||a.repo;a.home=web(m.application&&m.application.home);
    a.url=a.base+b.out;a.file=b.out.split('/').pop();a.summary=cat.summary||b.summary||'';
    var mode=cat.mode||b.mode,ver=cat.version||b.version;
    a.kind=mode==='deploy'?(ver?'Version '+ver:'Install'):mode==='drift'?'Drift check':('Test round '+(b.round||''));
    bar.style.width='60%';
    return get(a.url,false);
  }).then(function(t){
    if(my!==load||t===null){return}
    a.text=t;a.loaded=new Date();ready(a,false);
  }).catch(function(e){
    if(my!==load){return}
    var link=a.url?'<a class="btn" href="'+esc(a.url)+'">Open the script</a>':'<a class="btn" href="https://github.com/'+esc(a.repo)+'">Open the repository</a>';
    failCard('The script did not load.',e.message||'no answer',a.url?'Select "Open the script". On that page press Ctrl+A, then Ctrl+C. Then do the steps for PowerShell ISE.':a.none?'No script is published for this application yet. Ask in the Teams channel.':'Check the network connection, then select "Try again".',
      '<button type="button" class="btn primary" data-act="open" data-focus>Try again</button>'+link);
  });
}
function facts(a){
  var bytes=(window.TextEncoder?new TextEncoder().encode(a.text).length:a.text.length);
  return '<p class="second"><span class="file">'+esc(a.file)+'</span><br>'+num(bytes)+' bytes, '+num(a.text.split('\n').length)+' lines</p>';
}
var STEPS='<ol><li>Start menu: type ISE and open Windows PowerShell ISE as yourself (not "Run as administrator").</li>'+
  '<li>File &gt; New. Click in the white script pane. Press Ctrl+V, then F5.</li><li>The RADE window opens. Do what it says.</li></ol>';
function ready(a,copied){
  var t=a.loaded,hm=('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2);
  show({light:'turn',done:copied,bar:100,state:(copied?'Copied':'Ready')+' · loaded '+hm,html:
    '<p class="caps">'+esc(a.kind)+'</p><h1>'+(copied?'Copied. Now paste it in PowerShell ISE.':'Copy the script for '+esc(a.name).replace(/-/g,'\u2011')+'.')+'</h1>'+
    (copied?'':(a.summary?'<p>'+esc(a.summary)+'</p>':''))+facts(a)+
    '<div class="btns"><button type="button" class="btn primary" data-act="copy" data-focus>'+(copied?'Copy again':'Copy script')+'</button>'+
    '<a class="btn" href="'+esc(a.url)+'">Open the script</a>'+(a.home?'<a class="btn" href="'+esc(a.home)+'">Tasks for this application</a>':'')+'</div>'+
    STEPS+helpLine()});
}
function viaArea(t){var x=document.createElement('textarea');x.value=t;x.setAttribute('aria-hidden','true');x.style.position='fixed';x.style.opacity='0';document.body.appendChild(x);x.select();var r=false;try{r=document.execCommand('copy')}catch(e){}document.body.removeChild(x);return r}
function copy(a){
  var ok=function(){ready(a,true)};
  var no=function(){failCard('The browser blocked the copy.','the clipboard is not available to this page','Select "Open the script". On that page press Ctrl+A, then Ctrl+C. Then do the steps for PowerShell ISE.',
    '<a class="btn primary" href="'+esc(a.url)+'" data-focus>Open the script</a><button type="button" class="btn" data-act="copy">Try again</button>')};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(a.text).then(ok,function(){viaArea(a.text)?ok():no()})}
  else{viaArea(a.text)?ok():no()}
}
card.addEventListener('click',function(e){
  var b=e.target.closest('[data-act],[data-app]');if(!b){return}
  var act=b.getAttribute('data-act');
  if(b.hasAttribute('data-app')){open(APPS[+b.getAttribute('data-app')])}
  else if(act==='start'){start()}
  else if(act==='open'&&cur){open(cur)}
  else if(act==='copy'&&cur){copy(cur)}
});
back.addEventListener('click',function(e){e.preventDefault();choose()});
start();
})();
</script>
</body></html>
